name: Gerar aplicativos FVA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
            artifact: FVA-Linux
          - os: windows-latest
            name: Windows
            artifact: FVA-Windows
          - os: macos-15-intel
            name: macOS-Intel
            artifact: FVA-macOS-Intel
          - os: macos-15
            name: macOS-Apple-Silicon
            artifact: FVA-macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar arquivos de imagem
        shell: bash
        run: |
          test -f veiculo_real/assets/ufmg_logo.png || { echo 'Falta veiculo_real/assets/ufmg_logo.png'; exit 1; }
          test -f veiculo_real/assets/wallpaper_fva.png || { echo 'Falta veiculo_real/assets/wallpaper_fva.png'; exit 1; }
      - name: Dependências gráficas do Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libgl1
      - name: Instalar dependências
        run: python -m pip install -r requirements-build.txt
      - name: Compilar aplicativo
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name FVA --add-data "assets:assets" \
            tools/fva_gui_um_carro.py
      - name: Compactar aplicativo
        shell: python
        run: |
          from pathlib import Path
          import shutil
          name = '${{ matrix.artifact }}'
          shutil.make_archive(name, 'zip', root_dir='dist', base_dir='FVA' if Path('dist/FVA').is_dir() else 'FVA.app')
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
      - name: Anexar a release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
